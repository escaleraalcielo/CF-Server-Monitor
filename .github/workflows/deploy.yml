name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "server-monitor-pro"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          # 定时任务配置（UTC）
          # - 每分钟：执行离线节点检测
          # - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          # API_SECRET / API_USER_NAME 绝不能放进 [vars]——[vars] 是明文，在
          # Cloudflare 控制台和任何能读到这个文件的人面前都可见。它们由
          # `wrangler secret put` 写入为加密 Secret（见 deploy 步骤的 secrets:）。
          [vars]
          CORS_ALLOWED_ORIGINS = "CORS_ORIGINS_PLACEHOLDER"
          WEOF

          # 替换占位符。用 Node 做纯字符串替换，而不是 sed：sed 的替换串里
          # `|`、`&`、反引号和 `$(...)` 都有特殊含义，会破坏替换甚至在
          # runner 上执行命令。值经环境变量传入，不经过 shell 解析。
          node -e '
            const fs = require("fs");
            let t = fs.readFileSync("wrangler.toml", "utf8");
            const pairs = [
              ["D1_PLACEHOLDER", process.env.D1_DATABASE_ID],
              ["CORS_ORIGINS_PLACEHOLDER", process.env.CORS_ALLOWED_ORIGINS],
            ];
            for (const [k, v] of pairs) {
              if (!v) { console.error(`missing value for ${k}`); process.exit(1); }
              t = t.split(k).join(v);
            }
            fs.writeFileSync("wrangler.toml", t);
          '

          echo "✅ wrangler.toml 已生成（API_SECRET / API_USER_NAME 走加密 Secret，不在 [vars] 里）"

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          API_USER_NAME: ${{ secrets.API_USER_NAME }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          # 这些走 `wrangler secret put`，在 Worker 里是加密 Secret，不会
          # 出现在 wrangler.toml、[vars] 或部署产物里。
          secrets: |
            API_SECRET
            API_USER_NAME
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
